name: Windows Portable EXE

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Immutable release tag or ref to build and publish"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  windows-portable:
    name: Build and validate Windows x64 portable EXE
    runs-on: windows-latest
    env:
      PYTHON_VERSION: "3.13"
      VLC_VERSION: "3.0.23"
      VLC_ZIP_SHA256: "992d19dbd0b8a7cde9167d2f7780b1ef6f92acc8a71acfa736101a21f35181e1"
      RELEASE_REF: ${{ inputs.release_ref || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Resolve release identity
        shell: pwsh
        run: |
          $sourceCommit = (git rev-parse HEAD).Trim()
          $releaseTag = $env:GITHUB_REF_NAME
          if ($env:RELEASE_REF) { $releaseTag = $env:RELEASE_REF }
          "BUILD_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Build source commit: $sourceCommit"
          Write-Host "Release tag: $releaseTag"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/windows-build-requirements.txt

      - name: Install application and pinned packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r packaging/windows-build-requirements.txt

      - name: Read application version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Application version: $version"

      - name: Validate tag and application version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_ref != ''
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -ne "v$env:APP_VERSION") {
            throw "Release tag $env:RELEASE_TAG does not match application version $env:APP_VERSION"
          }

      - name: Acquire pinned official VLC runtime
        shell: pwsh
        run: .\scripts\prepare_windows_vlc.ps1 -VlcVersion $env:VLC_VERSION

      - name: Configure bundled VLC environment
        shell: pwsh
        run: |
          $vlcRoot = Get-Content build/windows/vlc-root.txt -Raw
          $vlcRoot = $vlcRoot.Trim()
          "VLC_RUNTIME_DIR=$vlcRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHON_VLC_LIB_PATH=$vlcRoot\libvlc.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHON_VLC_MODULE_PATH=$vlcRoot\plugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VLC_PLUGIN_PATH=$vlcRoot\plugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Bundled VLC root configured"

      - name: Verify pinned VLC runtime files
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VLC_RUNTIME_DIR\libvlc.dll")) { throw "libvlc.dll missing" }
          if (-not (Test-Path "$env:VLC_RUNTIME_DIR\libvlccore.dll")) { throw "libvlccore.dll missing" }
          if (-not (Test-Path "$env:VLC_RUNTIME_DIR\plugins")) { throw "VLC plugins missing" }
          $count = (Get-ChildItem "$env:VLC_RUNTIME_DIR\plugins" -Recurse -Filter *.dll).Count
          if ($count -le 0) { throw "No VLC plugin DLLs found" }
          Write-Host "VLC plugin DLL count: $count"

      - name: Ruff
        shell: pwsh
        run: ruff check src/ tests/ providers/ scripts/

      - name: Black
        shell: pwsh
        run: black --check src/ tests/ providers/

      - name: mypy
        shell: pwsh
        run: mypy src/

      - name: pytest (Windows non-Qt corpus)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $testFiles = @(Get-ChildItem -Path tests -Filter 'test_*.py' -File |
            Where-Object { $_.Name -notlike 'test_presentation_*.py' } |
            ForEach-Object { $_.FullName })
          if ($testFiles.Count -eq 0) { throw "No Windows non-Qt tests were selected" }
          pytest -q $testFiles

      - name: Windows native VLC lifecycle against bundled runtime
        shell: pwsh
        run: python tests/vlc_native_lifecycle_probe.py

      - name: Build one-file EXE
        shell: pwsh
        run: .\scripts\build_windows.ps1 -VlcRoot $env:VLC_RUNTIME_DIR

      - name: Run generated EXE packaged-VLC smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\SamoTech-IPTV-Player-Windows-x64.exe"
          $diagnosticPath = Join-Path $env:RUNNER_TEMP "samotech-packaged-vlc-diagnostic.json"
          $env:SAMOTECH_STARTUP_DIAGNOSTIC_PATH = $diagnosticPath
          & $exe --packaged-vlc-test --diagnostic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $diagnosticPath)) { throw "Packaged-VLC diagnostic artifact was not created" }
          $diagnostic = Get-Content $diagnosticPath -Raw | ConvertFrom-Json
          if ($diagnostic.status -ne "ready") { throw "Packaged-VLC diagnostic status was not ready" }
          if ($diagnostic.last_successful_stage -ne "VLC_READY") { throw "Packaged-VLC diagnostic did not reach VLC_READY" }

      - name: Run generated EXE Qt/application smoke test with startup diagnostics
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\SamoTech-IPTV-Player-Windows-x64.exe"
          $diagnosticPath = Join-Path $env:RUNNER_TEMP "samotech-qt-startup-diagnostic.json"
          $env:SAMOTECH_STARTUP_DIAGNOSTIC_PATH = $diagnosticPath
          & $exe --smoke-test --diagnostic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $diagnosticPath)) { throw "Qt startup diagnostic artifact was not created" }
          $diagnostic = Get-Content $diagnosticPath -Raw | ConvertFrom-Json
          if ($diagnostic.status -ne "ready") { throw "Qt startup diagnostic status was not ready" }
          if ($diagnostic.last_successful_stage -ne "APPLICATION_READY") { throw "Qt startup did not reach APPLICATION_READY" }
          if ($diagnostic.completed_stages -notcontains "VLC_READY") { throw "Qt startup did not record VLC_READY" }
          if ($diagnostic.completed_stages -notcontains "MAIN_WINDOW_SHOWN") { throw "Qt startup did not record MAIN_WINDOW_SHOWN" }
          New-Item -ItemType Directory -Force -Path build\startup-diagnostics | Out-Null
          Copy-Item $diagnosticPath build\startup-diagnostics\generated-qt-startup-diagnostic.json -Force
          Write-Host "startup_diagnostic=PASS last_stage=$($diagnostic.last_successful_stage)"

      - name: Run optional sanitized debug launcher smoke test
        shell: pwsh
        run: |
          $debugRoot = Join-Path $env:RUNNER_TEMP "SamoTech Debug Launcher Validation"
          New-Item -ItemType Directory -Force -Path $debugRoot | Out-Null
          Copy-Item "dist\SamoTech-IPTV-Player-Windows-x64.exe" (Join-Path $debugRoot "SamoTech-IPTV-Player-Windows-x64.exe") -Force
          Copy-Item "packaging\SamoTech-Debug.bat" (Join-Path $debugRoot "SamoTech-Debug.bat") -Force
          $diagnosticPath = Join-Path $debugRoot "debug-launcher-startup-diagnostic.json"
          $env:SAMOTECH_STARTUP_DIAGNOSTIC_PATH = $diagnosticPath
          $env:SAMOTECH_DEBUG_NO_PAUSE = "1"
          Push-Location $debugRoot
          try {
            cmd.exe /d /c ".\SamoTech-Debug.bat --smoke-test"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
            Remove-Item Env:SAMOTECH_DEBUG_NO_PAUSE -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $diagnosticPath)) { throw "Debug launcher did not create a startup diagnostic" }
          $diagnostic = Get-Content $diagnosticPath -Raw | ConvertFrom-Json
          if ($diagnostic.status -ne "ready") { throw "Debug launcher diagnostic status was not ready" }
          if ($diagnostic.last_successful_stage -ne "APPLICATION_READY") { throw "Debug launcher did not reach APPLICATION_READY" }
          Write-Host "debug_launcher=PASS last_stage=$($diagnostic.last_successful_stage)"

      - name: Validate outside repository with sanitized PATH
        shell: pwsh
        run: |
          $sourceExe = Resolve-Path "dist\SamoTech-IPTV-Player-Windows-x64.exe"
          $cleanRoot = Join-Path $env:TEMP "SamoTech Portable Validation 空 folder"
          New-Item -ItemType Directory -Force -Path $cleanRoot | Out-Null
          $cleanExe = Join-Path $cleanRoot "SamoTech-IPTV-Player-Windows-x64.exe"
          Copy-Item $sourceExe $cleanExe -Force
          $pythonOnPath = [bool](Get-Command python -ErrorAction SilentlyContinue)
          $vlcOnPath = [bool](Get-Command vlc -ErrorAction SilentlyContinue)
          $libvlcOnPath = [bool](Get-Command libvlc.dll -ErrorAction SilentlyContinue)
          Write-Host "where_python_available_before_sanitize=$pythonOnPath"
          Write-Host "where_vlc_available_before_sanitize=$vlcOnPath"
          Write-Host "where_libvlc_available_before_sanitize=$libvlcOnPath"
          $oldPath = $env:Path
          try {
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
            $env:SAMOTECH_STARTUP_DIAGNOSTIC_PATH = Join-Path $cleanRoot "startup-diagnostic.json"
            & $cleanExe --packaged-vlc-test --diagnostic
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $cleanExe --smoke-test --diagnostic
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path $env:SAMOTECH_STARTUP_DIAGNOSTIC_PATH)) { throw "Sanitized-PATH startup diagnostic was not created" }
            $diagnostic = Get-Content $env:SAMOTECH_STARTUP_DIAGNOSTIC_PATH -Raw | ConvertFrom-Json
            if ($diagnostic.status -ne "ready") { throw "Sanitized-PATH startup diagnostic status was not ready" }
            if ($diagnostic.completed_stages -notcontains "MAIN_WINDOW_SHOWN") { throw "Sanitized-PATH startup did not reach MAIN_WINDOW_SHOWN" }
          } finally {
            $env:Path = $oldPath
          }

      - name: Audit generated artifact contents
        shell: pwsh
        run: python scripts/audit_windows_artifact.py --exe dist\SamoTech-IPTV-Player-Windows-x64.exe

      - name: Name artifact and generate SHA256SUMS
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          if ($env:RELEASE_TAG -like "v*") {
            $artifactName = "SamoTech-IPTV-Player-Windows-x64-v$env:APP_VERSION.exe"
          } else {
            $artifactName = "SamoTech-IPTV-Player-Windows-x64-build-$shortSha.exe"
          }
          $releaseRoot = "dist\release"
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          $artifactPath = Join-Path $releaseRoot $artifactName
          Copy-Item "dist\SamoTech-IPTV-Player-Windows-x64.exe" $artifactPath -Force
          Copy-Item "packaging\SamoTech-Debug.bat" (Join-Path $releaseRoot "SamoTech-Debug.bat") -Force
          $hash = (Get-FileHash -Algorithm SHA256 $artifactPath).Hash.ToLowerInvariant()
          $debugLauncher = Join-Path $releaseRoot "SamoTech-Debug.bat"
          $debugHash = (Get-FileHash -Algorithm SHA256 $debugLauncher).Hash.ToLowerInvariant()
          @(
            "$hash  $artifactName",
            "$debugHash  SamoTech-Debug.bat"
          ) | Set-Content -Encoding ascii (Join-Path $releaseRoot "SHA256SUMS.txt")
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_PATH=$artifactPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Artifact: $artifactName"
          Write-Host "SHA256: $hash"

      - name: Build metadata summary
        shell: pwsh
        run: |
          $buildTimestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          "BUILD_TIMESTAMP_UTC=$buildTimestamp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @(
            "commit=$env:BUILD_COMMIT",
            "version=$env:APP_VERSION",
            "python=$env:PYTHON_VERSION",
            "pyinstaller=6.22.1",
            "pyside6=6.11.1",
            "python_vlc=3.0.21203",
            "vlc=$env:VLC_VERSION",
            "architecture=Windows x64",
            "build_timestamp_utc=$buildTimestamp",
            "artifact=$env:ARTIFACT_NAME",
            "sha256=$env:ARTIFACT_SHA256",
            "size_bytes=$((Get-Item $env:ARTIFACT_PATH).Length)"
          ) | Out-File -FilePath build-metadata.txt -Encoding utf8
          Get-Content build-metadata.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Generate automated release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_ref != ''
        shell: pwsh
        run: |
          $artifactSize = (Get-Item $env:ARTIFACT_PATH).Length
          @(
            "version=$env:APP_VERSION",
            "release_tag=$env:RELEASE_TAG",
            "commit=$env:BUILD_COMMIT",
            "workflow_run=$env:GITHUB_RUN_ID",
            "workflow_url=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "artifact=$env:ARTIFACT_NAME",
            "sha256=$env:ARTIFACT_SHA256",
            "size_bytes=$artifactSize",
            "build_timestamp_utc=$env:BUILD_TIMESTAMP_UTC",
            "architecture=Windows x64",
            "python=$env:PYTHON_VERSION",
            "pyinstaller=6.22.1",
            "pyside6=6.11.1",
            "python_vlc=3.0.21203",
            "vlc=$env:VLC_VERSION",
            "validation_summary=PASS: blocking Windows build, native VLC, packaged-VLC, Qt smoke, startup diagnostics, MAIN_WINDOW_SHOWN, sanitized PATH, artifact audit, checksum, and upload gates"
          ) | Set-Content -Encoding utf8 build/release-metadata.txt
          python scripts/generate_release_notes.py `
            --template packaging/release_notes_template.md `
            --metadata-file build/release-metadata.txt `
            --limitations-file PROJECT_STATUS.md `
            --output dist/release/release-notes.md
          Get-Content dist/release/release-notes.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ github.sha }}
          path: |
            dist/release/*.exe
            dist/release/*.bat
            dist/release/SHA256SUMS.txt
            dist/release/release-notes.md
            build-metadata.txt
            build/startup-diagnostics/*.json
          if-no-files-found: error


  publish-release:
    name: Publish tagged Windows release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_ref != ''
    needs: windows-portable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download validated portable artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-portable-${{ github.sha }}
          path: .

      - name: Publish tagged GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_ref || github.ref_name }}
          files: |
            dist/release/*.exe
            dist/release/*.bat
            dist/release/SHA256SUMS.txt
          body_path: dist/release/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
