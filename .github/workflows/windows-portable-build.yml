name: Windows Portable EXE

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    name: Build and validate Windows x64 portable EXE
    runs-on: windows-latest
    env:
      PYTHON_VERSION: "3.13"
      VLC_VERSION: "3.0.23"
      VLC_ZIP_SHA256: "992d19dbd0b8a7cde9167d2f7780b1ef6f92acc8a71acfa736101a21f35181e1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/windows-build-requirements.txt

      - name: Install application and pinned packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r packaging/windows-build-requirements.txt

      - name: Read application version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Application version: $version"

      - name: Acquire pinned official VLC runtime
        shell: pwsh
        run: .\scripts\prepare_windows_vlc.ps1 -VlcVersion $env:VLC_VERSION

      - name: Configure bundled VLC environment
        shell: pwsh
        run: |
          $vlcRoot = Get-Content build/windows/vlc-root.txt -Raw
          $vlcRoot = $vlcRoot.Trim()
          "VLC_RUNTIME_DIR=$vlcRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHON_VLC_LIB_PATH=$vlcRoot\libvlc.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHON_VLC_MODULE_PATH=$vlcRoot\plugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VLC_PLUGIN_PATH=$vlcRoot\plugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Bundled VLC root configured"

      - name: Verify pinned VLC runtime files
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VLC_RUNTIME_DIR\libvlc.dll")) { throw "libvlc.dll missing" }
          if (-not (Test-Path "$env:VLC_RUNTIME_DIR\libvlccore.dll")) { throw "libvlccore.dll missing" }
          if (-not (Test-Path "$env:VLC_RUNTIME_DIR\plugins")) { throw "VLC plugins missing" }
          $count = (Get-ChildItem "$env:VLC_RUNTIME_DIR\plugins" -Recurse -Filter *.dll).Count
          if ($count -le 0) { throw "No VLC plugin DLLs found" }
          Write-Host "VLC plugin DLL count: $count"

      - name: Ruff
        shell: pwsh
        run: ruff check src/ tests/ providers/ scripts/

      - name: Black
        shell: pwsh
        run: black --check src/ tests/ providers/

      - name: mypy
        shell: pwsh
        run: mypy src/

      - name: pytest
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Windows native VLC lifecycle against bundled runtime
        shell: pwsh
        run: python tests/vlc_native_lifecycle_probe.py

      - name: Build one-file EXE
        shell: pwsh
        run: .\scripts\build_windows.ps1 -VlcRoot $env:VLC_RUNTIME_DIR

      - name: Run generated EXE packaged-VLC smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\SamoTech-IPTV-Player-Windows-x64.exe"
          & $exe --packaged-vlc-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run generated EXE Qt/application smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\SamoTech-IPTV-Player-Windows-x64.exe"
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate outside repository with sanitized PATH
        shell: pwsh
        run: |
          $sourceExe = Resolve-Path "dist\SamoTech-IPTV-Player-Windows-x64.exe"
          $cleanRoot = Join-Path $env:TEMP "SamoTech Portable Validation 空 folder"
          New-Item -ItemType Directory -Force -Path $cleanRoot | Out-Null
          $cleanExe = Join-Path $cleanRoot "SamoTech-IPTV-Player-Windows-x64.exe"
          Copy-Item $sourceExe $cleanExe -Force
          $pythonOnPath = [bool](Get-Command python -ErrorAction SilentlyContinue)
          $vlcOnPath = [bool](Get-Command vlc -ErrorAction SilentlyContinue)
          $libvlcOnPath = [bool](Get-Command libvlc.dll -ErrorAction SilentlyContinue)
          Write-Host "where_python_available_before_sanitize=$pythonOnPath"
          Write-Host "where_vlc_available_before_sanitize=$vlcOnPath"
          Write-Host "where_libvlc_available_before_sanitize=$libvlcOnPath"
          $oldPath = $env:Path
          try {
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
            & $cleanExe --packaged-vlc-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $cleanExe --smoke-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:Path = $oldPath
          }

      - name: Audit generated artifact contents
        shell: pwsh
        run: python scripts/audit_windows_artifact.py --exe dist\SamoTech-IPTV-Player-Windows-x64.exe

      - name: Name artifact and generate SHA256SUMS
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $artifactName = "SamoTech-IPTV-Player-Windows-x64-v$env:APP_VERSION.exe"
          } else {
            $artifactName = "SamoTech-IPTV-Player-Windows-x64-build-$shortSha.exe"
          }
          $releaseRoot = "dist\release"
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          $artifactPath = Join-Path $releaseRoot $artifactName
          Copy-Item "dist\SamoTech-IPTV-Player-Windows-x64.exe" $artifactPath -Force
          $hash = (Get-FileHash -Algorithm SHA256 $artifactPath).Hash.ToLowerInvariant()
          "$hash  $artifactName" | Set-Content -Encoding ascii (Join-Path $releaseRoot "SHA256SUMS.txt")
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_PATH=$artifactPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Artifact: $artifactName"
          Write-Host "SHA256: $hash"

      - name: Build metadata summary
        shell: pwsh
        run: |
          @(
            "commit=$env:GITHUB_SHA",
            "version=$env:APP_VERSION",
            "python=$env:PYTHON_VERSION",
            "pyinstaller=6.22.1",
            "vlc=$env:VLC_VERSION",
            "artifact=$env:ARTIFACT_NAME",
            "sha256=$env:ARTIFACT_SHA256",
            "size_bytes=$((Get-Item $env:ARTIFACT_PATH).Length)"
          ) | Out-File -FilePath build-metadata.txt -Encoding utf8
          Get-Content build-metadata.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ github.sha }}
          path: |
            dist/release/*.exe
            dist/release/SHA256SUMS.txt
            build-metadata.txt
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.exe
            dist/release/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
