name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Qt offscreen runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify PySide6 offscreen runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          uv run python -c "from PySide6.QtGui import QKeyEvent;
          from PySide6.QtWidgets import QApplication, QLabel;
          app = QApplication([]); print('pyside6_offscreen_import=PASS'); app.quit()"

      - name: Run native Qt probes
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          uv run python tests/player_shell_native_probe.py
          uv run python tests/player_shell_performance_probe.py

      - name: Ruff lint
        run: uv run ruff check src/ tests/ providers/

      - name: Black format check
        run: uv run black --check src/ tests/ providers/

      - name: mypy typecheck
        run: uv run mypy src/

      - name: pytest (unit + integration)
        run: uv run pytest -q --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
        continue-on-error: true

  build:
    name: PyInstaller Build (Windows)
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build with PyInstaller
        run: uv run pyinstaller samotech-iptv-player.spec
        continue-on-error: true  # spec not yet created in Phase 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: samotech-iptv-player-windows
          path: dist/
        if: always()
