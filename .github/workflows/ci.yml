name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt offscreen runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify PySide6 offscreen runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -c "from PySide6.QtGui import QKeyEvent;
          from PySide6.QtWidgets import QApplication, QLabel;
          app = QApplication([]); print('pyside6_offscreen_import=PASS'); app.quit()"

      - name: Run native Qt probes
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          python tests/player_shell_native_probe.py
          python tests/player_shell_performance_probe.py

      - name: Ruff lint
        run: ruff check src/ tests/ providers/ scripts/

      - name: Black format check
        run: black --check src/ tests/ providers/

      - name: mypy typecheck
        run: mypy src/

      - name: pytest (unit + integration)
        run: pytest -q --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
        continue-on-error: true
