name: Windows Release Artifact Acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag whose exact EXE asset must be validated
        required: true
        default: v0.1.1
        type: string

permissions:
  contents: read

jobs:
  release-artifact-acceptance:
    name: Validate exact published Windows release artifact
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download exact release assets
        shell: pwsh
        run: |
          $assetName = "SamoTech-IPTV-Player-Windows-x64-$env:RELEASE_TAG.exe"
          $releaseRoot = Join-Path $env:RUNNER_TEMP "samotech-release-acceptance"
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:RELEASE_REPOSITORY `
            --pattern $assetName `
            --pattern SHA256SUMS.txt `
            --dir $releaseRoot
          if (-not (Test-Path (Join-Path $releaseRoot $assetName))) {
            throw "Expected release EXE was not downloaded: $assetName"
          }
          "RELEASE_ROOT=$releaseRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_EXE=$releaseRoot\$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify checksum, PE metadata, and artifact identity
        shell: pwsh
        run: |
          $checksumFile = Join-Path $env:RELEASE_ROOT "SHA256SUMS.txt"
          $expected = (Get-Content $checksumFile | Select-Object -First 1).Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $env:RELEASE_EXE).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "Release checksum mismatch: expected $expected, actual $actual"
          }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($env:RELEASE_EXE)
          if ($version.FileVersion -ne $env:RELEASE_TAG.TrimStart('v')) {
            throw "FileVersion $($version.FileVersion) does not match $env:RELEASE_TAG"
          }
          if ($version.ProductVersion -ne $env:RELEASE_TAG.TrimStart('v')) {
            throw "ProductVersion $($version.ProductVersion) does not match $env:RELEASE_TAG"
          }
          $pe = Get-Item $env:RELEASE_EXE
          Write-Host "artifact=$($pe.Name)"
          Write-Host "size_bytes=$($pe.Length)"
          Write-Host "sha256=$actual"
          Write-Host "file_version=$($version.FileVersion)"
          Write-Host "product_version=$($version.ProductVersion)"
          Write-Host "architecture=Windows x64 workflow runner"

      - name: Execute actual release artifact across path and environment matrix
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $cases = @(
            @{ Name = "c-drive"; Root = (Join-Path $env:SystemDrive "SamoTech Portable Acceptance"); Cwd = $null },
            @{ Name = "spaces"; Root = (Join-Path $env:RUNNER_TEMP "SamoTech Portable Acceptance"); Cwd = $null },
            @{ Name = "unicode"; Root = (Join-Path $env:RUNNER_TEMP "SamoTech Portable Acceptance 测试"); Cwd = $null },
            @{ Name = "downloads-like"; Root = (Join-Path $env:USERPROFILE "Downloads\SamoTech Portable Acceptance"); Cwd = $null },
            @{ Name = "temporary"; Root = (Join-Path $env:TEMP "SamoTech Portable Acceptance"); Cwd = $null },
            @{ Name = "arbitrary-cwd"; Root = (Join-Path $env:RUNNER_TEMP "SamoTech Portable Acceptance CWD"); Cwd = $env:SystemRoot }
          )
          $diagnosticRoot = Join-Path $env:RUNNER_TEMP "samotech-release-acceptance-diagnostics"
          New-Item -ItemType Directory -Force -Path $diagnosticRoot | Out-Null
          $pathModes = @(
            @{ Name = "normal-path"; Value = $env:Path },
            @{ Name = "sanitized-path"; Value = "$env:SystemRoot\System32;$env:SystemRoot" }
          )
          foreach ($case in $cases) {
            $root = $case.Root
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $caseExe = Join-Path $root "SamoTech-IPTV-Player-Windows-x64.exe"
            Copy-Item $env:RELEASE_EXE $caseExe -Force
            $cwd = if ($null -eq $case.Cwd) { $root } else { $case.Cwd }
            foreach ($pathMode in $pathModes) {
              foreach ($launchNumber in @(1, 2)) {
                foreach ($argument in @("--packaged-vlc-test", "--smoke-test")) {
                  $prefix = "$($case.Name)-$($pathMode.Name)-launch$launchNumber-$($argument.TrimStart('-'))"
                  $stdout = Join-Path $root "$prefix.stdout.log"
                  $stderr = Join-Path $root "$prefix.stderr.log"
                  $diagnosticPath = Join-Path $diagnosticRoot "$prefix.startup-diagnostic.json"
                  $diagnosticFallbackPath = Join-Path (Join-Path $env:TEMP "SamoTech\IPTV Player") (Split-Path $diagnosticPath -Leaf)
                  $oldPath = $env:Path
                  try {
                    $env:Path = $pathMode.Value
                    $env:SAMOTECH_STARTUP_DIAGNOSTIC_PATH = $diagnosticPath
                    Remove-Item $diagnosticPath -Force -ErrorAction SilentlyContinue
                    $process = Start-Process -FilePath $caseExe -ArgumentList @($argument, "--diagnostic") -WorkingDirectory $cwd -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
                    if (-not ($process.WaitForExit(90 * 1000))) {
                      $process.Kill()
                      throw "$prefix timed out"
                    }
                    if ($process.ExitCode -ne 0) {
                      if (Test-Path $stdout) { Write-Host "stdout=$((Get-Content $stdout -Raw))" }
                      if (Test-Path $stderr) { Write-Host "stderr=$((Get-Content $stderr -Raw))" }
                      throw "$prefix exited with $($process.ExitCode)"
                    }
                    $actualDiagnosticPath = $diagnosticPath
                    if (-not (Test-Path $actualDiagnosticPath) -and (Test-Path $diagnosticFallbackPath)) {
                      $actualDiagnosticPath = $diagnosticFallbackPath
                      Write-Host "$prefix diagnostic_path_fallback=$actualDiagnosticPath"
                    }
                    if (-not (Test-Path $actualDiagnosticPath)) {
                      Write-Host "diagnostic_missing=$prefix"
                      Write-Host "case_exe=$caseExe"
                      Write-Host "case_exe_exists=$(Test-Path $caseExe)"
                      Write-Host "case_exe_length=$((Get-Item $caseExe).Length)"
                      if (Test-Path $stdout) { Write-Host "stdout=$((Get-Content $stdout -Raw))" }
                      if (Test-Path $stderr) { Write-Host "stderr=$((Get-Content $stderr -Raw))" }
                      $zone = Get-Item -Path $caseExe -Stream Zone.Identifier -ErrorAction SilentlyContinue
                      if ($null -ne $zone) {
                        Write-Host "zone_identifier_stream_length=$($zone.Length)"
                        Write-Host "zone_identifier=$(Get-Content -Path ($caseExe + ':Zone.Identifier') -Raw)"
                      } else {
                        Write-Host "zone_identifier_stream=absent"
                      }
                      throw "$prefix did not produce a startup diagnostic"
                    }
                    $diagnostic = Get-Content $actualDiagnosticPath -Raw | ConvertFrom-Json
                    if ($diagnostic.status -ne "ready") { throw "$prefix diagnostic status was not ready" }
                    if ($argument -eq "--packaged-vlc-test" -and $diagnostic.last_successful_stage -ne "VLC_READY") { throw "$prefix did not record VLC_READY" }
                    if ($argument -eq "--smoke-test") {
                      if ($diagnostic.last_successful_stage -ne "APPLICATION_READY") { throw "$prefix did not record APPLICATION_READY" }
                      if ($diagnostic.completed_stages -notcontains "VLC_READY") { throw "$prefix did not record VLC_READY" }
                      if ($diagnostic.completed_stages -notcontains "MAIN_WINDOW_SHOWN") { throw "$prefix did not record MAIN_WINDOW_SHOWN" }
                    }
                    Write-Host "$prefix exit_code=$($process.ExitCode) startup_stage=$($diagnostic.last_successful_stage)"
                  } finally {
                    $env:Path = $oldPath
                    Remove-Item Env:SAMOTECH_STARTUP_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
                    Remove-Item $diagnosticPath -Force -ErrorAction SilentlyContinue
                    Remove-Item $diagnosticFallbackPath -Force -ErrorAction SilentlyContinue
                  }
                }
              }
            }
          }

      - name: Publish acceptance summary
        shell: pwsh
        run: |
          @(
            "release_tag=$env:RELEASE_TAG",
            "artifact=$([IO.Path]::GetFileName($env:RELEASE_EXE))",
            "result=PASS",
            "checks=checksum,PE versions,packaged VLC smoke,Qt smoke,C drive,temporary directory,spaces,Unicode,Downloads-like path,arbitrary working directory,normal PATH,sanitized PATH,first launch,second launch"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
