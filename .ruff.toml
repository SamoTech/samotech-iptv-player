line-length = 100
target-version = "py313"
src = ["src"]

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "ANN", "S", "TCH"]

[lint.per-file-ignores]
# Pytest assertions are executable specifications, not production security checks.
"tests/**/*.py" = ["S101"]

[lint.isort]
known-first-party = ["samotech_iptv"]
