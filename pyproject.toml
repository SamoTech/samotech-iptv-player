[project]
name = "samotech-iptv-player"
version = "0.1.0"
description = "A modern IPTV desktop player with Clean Architecture — PySide6 + VLC + Xtream/Stalker support"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Ossama Hashim", email = "samo.hossam@gmail.com" }]
keywords = ["iptv", "m3u", "vlc", "pyside6", "streaming", "epg"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Environment :: Win32 (MS Windows)",
]

dependencies = [
    "PySide6>=6.8",
    "python-vlc>=3.0.21",
    "aiohttp>=3.11",
    "aiofiles>=24.1",
    "Pillow>=11.0",
    "keyring>=25.4",
    "pydantic>=2.9",
    "lxml>=5.3",
    "appdirs>=1.4",
    "packaging>=24.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "black>=24.10",
    "pre-commit>=4.0",
    "pyinstaller>=6.11",
    "types-Pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samotech_iptv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -q"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "ANN", "S", "TCH"]
ignore = ["ANN101", "ANN102"]

[tool.black]
line-length = 100
target-version = ["py313"]
