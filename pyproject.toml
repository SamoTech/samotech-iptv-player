[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "samotech-iptv-player"
version = "0.1.0"
description = "SamoTech IPTV Player with pluggable provider architecture"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "aioresponses>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths  = ["tests"]

# ── Package discovery ─────────────────────────────────────────────────────────
# src/ layout: canonical package lives under src/
# Legacy providers/ package kept for backward-compat migration window
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["samotech_iptv*", "providers*"]

[tool.setuptools.package-dir]
"" = "src"

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["src", "tests"]

# ── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
mypy_path = "src"
packages = ["samotech_iptv"]
