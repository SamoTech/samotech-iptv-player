[build-system]
requires = ["setuptools>=70", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "samotech-iptv-player"
version = "0.1.5"
description = "SamoTech IPTV Player with pluggable provider architecture"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "defusedxml>=0.7",
    "keyring>=25",
    "python-vlc>=3.0.21203",
    "PySide6>=6.7",
    "qasync>=0.27",
]

[project.scripts]
samotech-iptv = "samotech_iptv.desktop_entrypoint:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "aioresponses>=0.7",
    "black>=24",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-defusedxml>=0.7",
    "pyinstaller==6.22.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths  = ["tests"]

# ── Package discovery ─────────────────────────────────────────────────────────
# The canonical package lives under src/.  The legacy providers package is
# retained during the migration and must ship with the MAG adapter.
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["samotech_iptv*", "providers*"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["src", "tests"]

# ── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]

# ── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
mypy_path = "src"
packages = ["samotech_iptv"]

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*", "PySide6", "PySide6.*", "qasync"]
ignore_missing_imports = true
